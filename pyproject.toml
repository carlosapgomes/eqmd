[project]
name = "eqmd"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13.4",
    "django>=5.2.1,<5.3",
    "django-allauth>=0.57.0",
    "django-drf-filepond>=0.5.0",
    "django-model-utils>=5.0.0",
    "django-oidc-provider>=0.9.0",
    "django-simple-history>=3.10.1",
    "django-storages>=1.14.6",
    "django-taggit>=6.1.0",
    "faker>=33.1.0",
    "ffmpeg-python>=0.2.0",
    "firebase-admin>=7.1.0",
    "markdown>=3.8.2",
    "mistune>=3.0,<4",
    "matrix-nio>=0.24.0",
    "openpyxl>=3.1.5",
    "pdf2image>=1.17.0",
    "pillow>=11.3.0",
    "psycopg2-binary>=2.9.10",
    "pyjwt>=2.10.1",
    "pypdf>=5.8.0",
    "python-dotenv>=1.0.0",
    "pytz>=2025.2",
    "reportlab>=4.4.2",
]

[dependency-groups]
dev = [
    "coverage>=7.8.2",
    "django-debug-toolbar>=5.2.0",
    "django-stubs>=5.1.3",
    "factory-boy>=3.3.3",
    "mypy>=1.18.2,<1.19",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "pytest-django>=4.11.1",
    "ruff>=0.16.4,<0.17",
]
prod = [
    "gunicorn>=23.0.0",
]

[tool.ruff.lint.per-file-ignores]
# RUF012 (mutable class attribute): Django ModelForm `Meta.fields` and
# `Meta.widgets` are declarative class attributes consumed by Django's
# ModelFormMetaclass; the `typing.ClassVar` annotation pattern does not
# apply to framework-declared Meta attributes. Narrow to this single
# patients form module; no project-wide ignore.
"apps/patients/forms.py" = ["RUF012"]
# BLE001 (blind exception): the broad `except Exception` is the documented
# slice 006/006A production contract for the 500 error path of the
# patients tag/clinical HTTP endpoints; narrowing would change behavior.
"apps/patients/views.py" = ["BLE001"]
# DTZ011 (naive date.today): replacing with a timezone-aware call is a
# behavior change deferred to the clinical timezone work (slice 009A R2).
"apps/patients/models.py" = ["DTZ011"]

[tool.mypy]
python_version = "3.12"
# Keep django plugin disabled in Phase 0 due internal crashes in current stack.
# Re-evaluate enabling `mypy_django_plugin.main` during rollout hardening.
exclude = "(^|/)migrations/"
warn_unused_configs = true
check_untyped_defs = false
disallow_untyped_defs = false
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["config.settings", "config.test_settings"]
ignore_errors = true

# Frozen pre-existing mypy inventory (82 findings) in patients models/views
# (see slice 009 report section 2.1 categories B; slice 009A R4). These
# files pass ruff but carry pre-existing type errors; enforcement returns
# with the clinical timezone/typing hardening slice. No other changed
# file may use this escape hatch.
[[tool.mypy.overrides]]
module = ["apps.patients.models", "apps.patients.views"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.test_settings"
