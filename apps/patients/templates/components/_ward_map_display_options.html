<section class="border rounded p-3 mt-3"
         aria-labelledby="map-display-options-title"
         data-map-display-options>
  <h3 class="h6 mb-3" id="map-display-options-title">Visualização do mapa</h3>
  <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
    <div>
      <div class="form-check">
        <input class="form-check-input border-primary"
               type="checkbox"
               id="show-empty-wards"
               name="show_empty_wards"
               value="true"
               aria-describedby="map-empty-wards-help"
               {% if show_empty_wards %}checked{% endif %}>
        <label class="form-check-label" for="show-empty-wards">
          <i class="bi bi-building me-1" aria-hidden="true"></i>
          Mostrar alas vazias
        </label>
      </div>
      <p class="small text-muted mb-0 mt-1" id="map-empty-wards-help">
        Inclui alas sem pacientes correspondentes aos filtros atuais.
        Use Aplicar filtros para atualizar esta opção.
      </p>
    </div>
    <div class="btn-group" role="group" aria-label="Controles de visualização do mapa">
      <button type="button" class="btn btn-outline-secondary" id="expand-all"
              title="Expandir todas" aria-label="Expandir todas">
        <i class="bi bi-arrows-expand" aria-hidden="true"></i>
      </button>
      <button type="button" class="btn btn-outline-secondary" id="collapse-all"
              title="Recolher todas" aria-label="Recolher todas">
        <i class="bi bi-arrows-collapse" aria-hidden="true"></i>
      </button>
      <button type="button" class="btn btn-outline-primary" id="refresh-data"
              title="Atualizar dados" aria-label="Atualizar dados">
        <i class="bi bi-arrow-clockwise" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</section>
