# EQMD frontend: immutable static files from eqmd_static + reverse proxy.
# The image is pinned in docker-compose.eon.yml. TLS ends at Cloudflare/Caddy;
# this server only speaks HTTP on the <REDE_INGRESS> network.
# Divergence from the origin: no TLS/HTTP2 here (terminated at the edge).

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    # Origin parity: the legacy Nginx accepts uploads up to 60 MB.
    client_max_body_size 60m;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Preserve the edge-provided scheme; fall back to this hop when absent.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    upstream eqmd_backend {
        server eqmd:8000;
    }

    server {
        listen 80;
        server_name equipemed.projetoshgrs.com _;

        # Service worker: never cache and keep the scope at the site root.
        location = /static/sw.js {
            alias /srv/eqmd/static/sw.js;
            gzip off;
            default_type text/javascript;
            types {
                text/javascript js;
            }
            charset utf-8;
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header Service-Worker-Allowed "/" always;
            expires off;
        }

        # Manifest is dynamic in Django; proxy it and prevent caching.
        location = /manifest.json {
            proxy_pass http://eqmd_backend;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-cache, must-revalidate" always;
            expires off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
        }

        # Collected static files only; the volume is mounted read-only.
        location /static/ {
            alias /srv/eqmd/static/;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Served-By "nginx-static" always;
        }

        # Media is authorization-protected in Django: never serve from disk.
        location /media/ {
            proxy_pass http://eqmd_backend;
            proxy_read_timeout 120s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
        }

        location / {
            proxy_pass http://eqmd_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
        }
    }
}
