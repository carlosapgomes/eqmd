name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # PR validation lives in ci-pr.yml; this workflow only publishes images.
  build-and-push:
    if: >-
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release tag belongs to main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            USER_ID=1001
            GROUP_ID=1001

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        if: github.event_name == 'push'
        with:
          languages: python

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v3
        if: github.event_name == 'push'

      - name: Image vulnerability scan
        uses: anchore/scan-action@v7
        id: scan
        if: github.event_name == 'push'
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          fail-build: false
          severity-cutoff: high

      - name: Validate SARIF report
        id: validate-sarif
        if: success() && github.event_name == 'push'
        run: |
          node scripts/validate-image-scan-sarif.mjs "${{ steps.scan.outputs.sarif }}"
          echo "validated-sarif=${{ steps.scan.outputs.sarif }}" >> "$GITHUB_OUTPUT"

      - name: Upload vulnerability scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: success() && github.event_name == 'push' && steps.validate-sarif.outputs.validated-sarif != ''
        with:
          sarif_file: ${{ steps.validate-sarif.outputs.validated-sarif }}

      - name: Upload SARIF as workflow artifact
        uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && steps.validate-sarif.outputs.validated-sarif != '' && !cancelled()
        with:
          name: vulnerability-scan-results
          path: ${{ steps.validate-sarif.outputs.validated-sarif }}
          retention-days: 30
